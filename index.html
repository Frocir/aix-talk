<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Datawhale AI+X 高校行 · 一线后端实践</title>
<meta name="description" content="内网小模型怎么把交付做对：知识库加 SDD。现场 PPT 原样预览，附逐页演讲稿。">
<link rel="canonical" href="https://deck.frocir.com/">
<link rel="preload" as="image" href="slides/s01.webp">
<style>
html,body{margin:0;height:100%;background:#0B1530;color:#E6EEFF;
  font-family:"Microsoft YaHei","微软雅黑","PingFang SC",system-ui,sans-serif;overflow:hidden}
.prog{position:fixed;top:0;left:0;height:3px;background:#1677FF;transition:width .2s;z-index:3}
.stage{position:fixed;inset:0 0 58px 0;display:flex;align-items:center;justify-content:center;padding:14px;box-sizing:border-box}
.stage img{max-width:100%;max-height:100%;width:auto;height:auto;border-radius:6px;background:#fff;
  box-shadow:0 10px 40px rgba(0,0,0,.45);user-select:none;-webkit-user-drag:none}
.hit{position:fixed;top:0;bottom:58px;width:30%;cursor:pointer;z-index:1}
.hit.l{left:0}.hit.r{right:0}
.bar{position:fixed;left:0;right:0;bottom:0;height:58px;display:flex;align-items:center;justify-content:center;
  gap:10px;background:rgba(6,14,36,.92);border-top:1px solid rgba(255,255,255,.06);z-index:2}
.btn{height:34px;min-width:34px;padding:0 12px;border-radius:999px;border:1px solid rgba(255,255,255,.18);
  background:transparent;color:#E6EEFF;font-size:15px;cursor:pointer;text-decoration:none;
  display:inline-flex;align-items:center;justify-content:center;font-family:inherit}
.btn:hover{background:#1677FF;border-color:#1677FF}
.btn.pri{background:#1677FF;border-color:#1677FF;font-weight:700;font-size:13px}
.btn.sm{font-size:13px}
#prev,#next{font-size:24px;line-height:1;padding-bottom:3px}
.no{font-variant-numeric:tabular-nums;min-width:74px;text-align:center;font-size:14px;color:#AFC2E6}
.no b{color:#fff;font-size:16px}
.ttl{position:fixed;left:18px;bottom:19px;font-size:13px;color:#8FA3C8;max-width:28vw;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;z-index:2}
@media (max-width:760px){.ttl{display:none}.btn.sm{display:none}}
</style>
</head>
<body>
<div class="prog" id="prog"></div>
<main class="stage"><img id="slide" src="slides/s01.webp" width="1920" height="1080" alt=""></main>
<div class="hit l" id="hitL" aria-hidden="true"></div>
<div class="hit r" id="hitR" aria-hidden="true"></div>
<div class="ttl" id="ttl"></div>
<nav class="bar" aria-label="翻页">
  <button class="btn" id="prev" aria-label="上一页">&lsaquo;</button>
  <span class="no"><b id="cur">01</b> / 30</span>
  <button class="btn" id="next" aria-label="下一页">&rsaquo;</button>
  <a class="btn pri" id="toScript" href="script.html#p1">看演讲稿</a>
  <button class="btn sm" id="fs">全屏</button>
</nav>
<script>
(function () {
  var T = ["一线后端实践 内网小模型，怎么把交付做对", "AI 伴随我的成长历程", "如果回到大一，我会做这几件事", "先讲判断，再讲做法", "《人月神话》的故事：IBM 的大项目是怎么延期的", "软件工程没有银弹", "AI 加快的是写，不是想清楚", "一个核心认知：AI 时代，人的价值在两端", "我的环境：为什么是知识库加 SDD", "SDD 是什么，谁把它做成了公开做法", "规格是真相，代码替它干活", "SDD 的五个步骤", "跑一遍 Spec Kit，手里会多出哪些文件", "模板为什么这么写：不让模型猜", "给小模型写 Spec，我会写清这四件", "CS / SE 的大作业，也能用 Spec 做", "规约放久了会过时：怎么分层、怎么维护", "OpenSpec：改动放进 changes，做完就归档", "顺手推荐几个好用的 AI 工具", "WorkBuddy：腾讯的 AI 办公助手", "三个 Skill，各自只在一个时机用", "grill-me：先把问题问清楚，再写代码", "grill-me 的原文：先画一棵设计树", "sdd 这个技能，好在它会停", "humanize：只改腔调，不动事实", "humanizer 的来历：维基编辑抓 AI 文的清单", "四份学习材料", "四个我常问自己的问题", "今天的三句话", "先做一个小的"];
  var N = T.length, cur = 1;
  var img = document.getElementById("slide");
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function src(n) { return "slides/s" + pad(n) + ".webp"; }
  function pre(n) { if (n >= 1 && n <= N) { var i = new Image(); i.src = src(n); } }
  function show(n) {
    n = Math.max(1, Math.min(N, n | 0));
    cur = n;
    img.src = src(n);
    img.alt = "第 " + n + " 页：" + T[n - 1];
    document.getElementById("cur").textContent = pad(n);
    document.getElementById("ttl").textContent = T[n - 1];
    document.getElementById("prog").style.width = (n / N * 100) + "%";
    document.getElementById("toScript").href = "script.html#p" + n;
    if (location.hash !== "#s" + n) history.replaceState(null, "", "#s" + n);
    pre(n + 1); pre(n - 1);
  }
  function fromHash() {
    var m = /^#s(\d+)$/.exec(location.hash);
    show(m ? +m[1] : 1);
  }
  document.getElementById("prev").onclick = function () { show(cur - 1); };
  document.getElementById("next").onclick = function () { show(cur + 1); };
  document.getElementById("hitL").onclick = function () { show(cur - 1); };
  document.getElementById("hitR").onclick = function () { show(cur + 1); };
  document.getElementById("fs").onclick = function () {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
  };
  document.addEventListener("keydown", function (e) {
    var k = e.key;
    if (k === "ArrowRight" || k === "ArrowDown" || k === "PageDown" || k === " ") { e.preventDefault(); show(cur + 1); }
    else if (k === "ArrowLeft" || k === "ArrowUp" || k === "PageUp") { e.preventDefault(); show(cur - 1); }
    else if (k === "Home") show(1);
    else if (k === "End") show(N);
  });
  var x0 = null;
  document.addEventListener("touchstart", function (e) { x0 = e.touches[0].clientX; }, { passive: true });
  document.addEventListener("touchend", function (e) {
    if (x0 === null) return;
    var dx = e.changedTouches[0].clientX - x0;
    if (Math.abs(dx) > 40) show(cur + (dx < 0 ? 1 : -1));
    x0 = null;
  }, { passive: true });
  window.addEventListener("hashchange", fromHash);
  fromHash();
})();
</script>
</body>
</html>
